# =====================================================================
#  NutriAnimales S.A. — Sistema de Monitoreo, Seguridad y Hardening
#  Lead University · BCD 9220 · III Cuatrimestre 2026
# =====================================================================
# Hardening aplicado en este archivo:
#   #1  Usuario no-root en contenedores (n8n 1000:1000, pgAdmin 5050:5050)
#   #2  Secretos solo en .env (chmod 600, en .gitignore)
#   #3  Red Docker aislada: nutrianimales-net (internal: true, 172.28.0.0/16)
#   #4  PostgreSQL SIN "ports:" -> solo Nginx (8080/8443) visible al host
#   #5  scram-sha-256 (POSTGRES_INITDB_ARGS + postgresql.conf)
#   #6  SSL/TLS en PostgreSQL (certificado generado en postgres/Dockerfile)
#   #10 Volúmenes en ./data con chmod 700 (ver scripts/setup.sh)
# =====================================================================

name: nutrianimales

services:

  postgres:
    build: ./postgres
    image: nutrianimales/postgres:16-hardened
    container_name: nutri_postgres
    restart: unless-stopped
    # Sin "ports:" -> la BD NO se expone al host (hardening #4)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nutrianimales_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      # Contraseñas de usuarios de aplicación (usadas por init/07_roles_y_config.sh)
      AGENTE_IA_PASSWORD: ${AGENTE_IA_PASSWORD}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD}
      GERENTE_DB_PASSWORD: ${GERENTE_DB_PASSWORD}
      TI_DB_PASSWORD: ${TI_DB_PASSWORD}
      AUDITOR_DB_PASSWORD: ${AUDITOR_DB_PASSWORD}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TZ: America/Costa_Rica
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # Se monta la CARPETA (no el archivo) para que los cambios en el host
      # se vean dentro del contenedor y la alerta H2 los detecte.
      - ./postgres/conf:/etc/postgresql:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      nutrianimales-net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutrianimales_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: nutri_n8n
    restart: unless-stopped
    user: "1000:1000"                       # hardening #1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http                    # TLS lo termina Nginx
      N8N_EDITOR_BASE_URL: https://localhost:8443/
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"  # los nodos no pueden leer variables de entorno
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console
      GENERIC_TIMEZONE: America/Costa_Rica
      TZ: America/Costa_Rica
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      nutrianimales-net:
        ipv4_address: 172.28.0.20
      nutrianimales-edge: {}                # salida a internet: Telegram y Groq
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nutri_pgadmin
    restart: unless-stopped
    user: "5050:5050"                       # usuario 'pgadmin' (no-root) de la imagen
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 30
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    networks:
      nutrianimales-net:
        ipv4_address: 172.28.0.30
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    container_name: nutri_nginx
    restart: unless-stopped
    depends_on:
      - n8n
      - pgadmin
    ports:
      - "8080:8080"     # HTTP -> redirige a HTTPS
      - "8443:8443"     # HTTPS (único punto de entrada)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      nutrianimales-net:
        ipv4_address: 172.28.0.40
      nutrianimales-edge: {}
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------
  # OPCIONAL: túnel público SOLO para el webhook del bot de Telegram.
  # Se levanta con:  docker compose --profile tunel up -d
  # Apunta al puerto interno 8444 de Nginx, que solo deja pasar /webhook/
  # (el editor de N8N y pgAdmin NO quedan expuestos a internet).
  # ---------------------------------------------------------------
  tunel:
    image: cloudflare/cloudflared:latest
    container_name: nutri_tunel
    profiles: ["tunel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --no-tls-verify --url https://nginx:8444
    depends_on:
      - nginx
    networks:
      - nutrianimales-edge

networks:
  nutrianimales-net:
    name: nutrianimales-net
    driver: bridge
    internal: true                # sin salida a internet (hardening #3)
    ipam:
      config:
        - subnet: 172.28.0.0/16
  nutrianimales-edge:
    name: nutrianimales-edge
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
