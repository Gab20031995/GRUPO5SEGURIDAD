# =====================================================================
#  Nginx — único punto de entrada (hardening #8 headers, #9 TLS)
# =====================================================================
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;                       # no revelar versión
    client_max_body_size 16m;
    sendfile on;

    log_format seguridad '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log seguridad;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Limita fuerza bruta contra el login de N8N / pgAdmin
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    # ---------- 8080: solo redirección a HTTPS ----------
    server {
        listen 8080;
        return 301 https://$host:8443$request_uri;
    }

    # ---------- 8443: editor N8N + pgAdmin + webhooks ----------
    server {
        listen 8443 ssl;
        http2 on;

        # Headers de seguridad (hardening #8)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # pgAdmin bajo /pgadmin/
        location /pgadmin/ {
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect off;
            proxy_pass http://pgadmin:5050/;
        }

        # Login de N8N con límite de peticiones
        location /rest/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # N8N (editor, API interna y webhooks)
        location / {
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }

    # ---------- 8444: SOLO webhooks (destino del túnel opcional) ----------
    # No se publica al host. Únicamente /webhook/ llega a N8N.
    server {
        listen 8444 ssl;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location /webhook/ {
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / { return 403; }
    }
}
