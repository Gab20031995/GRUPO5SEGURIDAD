# =====================================================================
#  pg_hba.conf — NutriAnimales S.A.
#  Regla general: solo TLS + scram-sha-256 desde la red Docker aislada.
#  Cualquier cambio a este archivo dispara la alerta H2 (hash MD5);
#  métodos md5/trust/password disparan H5.
# =====================================================================
# TYPE    DATABASE          USER      ADDRESS          METHOD

# Socket local dentro del contenedor (docker exec -u postgres psql)
local     all               postgres                   peer
local     all               all                        scram-sha-256

# Red Docker aislada nutrianimales-net, SOLO con TLS
hostssl   nutrianimales_db  all       172.28.0.0/16    scram-sha-256
hostssl   postgres          postgres  172.28.0.0/16    scram-sha-256

# Todo lo demás se rechaza explícitamente
host      all               all       0.0.0.0/0        reject
host      all               all       ::/0             reject
