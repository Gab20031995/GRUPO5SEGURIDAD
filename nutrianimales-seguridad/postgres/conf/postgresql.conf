# =====================================================================
#  postgresql.conf — NutriAnimales S.A. (endurecido)
#  Cualquier cambio a este archivo dispara la alerta H2 (hash MD5).
#  Los valores de seguridad están registrados en pg_settings_baseline (H5/R5).
# =====================================================================

# --- Conexión ---
listen_addresses = '*'            # solo alcanzable dentro de la red Docker
port = 5432
max_connections = 50
hba_file = '/etc/postgresql/pg_hba.conf'

# --- Autenticación y TLS (hardening #5 y #6) ---
password_encryption = 'scram-sha-256'
ssl = on
ssl_cert_file = '/etc/ssl/nutri/server.crt'
ssl_key_file  = '/etc/ssl/nutri/server.key'
ssl_min_protocol_version = 'TLSv1.2'

# --- Recursos ---
shared_buffers = 128MB
dynamic_shared_memory_type = posix

# --- Extensiones (alertas R1, D1, D6, D7) ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.max = 5000
track_activity_query_size = 2048

# --- Logs de auditoría (hardening #11, alerta R4) ---
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = off
log_line_prefix = '%m [%p] %q%u@%d %h '
log_min_duration_statement = 1000     # consultas > 1 s quedan en el log
log_connections = on
log_disconnections = on
log_statement = 'ddl'                 # todo CREATE/ALTER/DROP/GRANT queda registrado
log_lock_waits = on
deadlock_timeout = 1s
log_timezone = 'America/Costa_Rica'

# --- Zona horaria (alerta R3: horario no laboral) ---
timezone = 'America/Costa_Rica'
datestyle = 'iso, dmy'
lc_messages = 'C'                     # mensajes en inglés: R4 busca 'password authentication failed'
